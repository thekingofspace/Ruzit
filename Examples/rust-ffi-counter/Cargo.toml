[package]
name = "ruzit_ffi_counter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "ruzit_ffi_counter"

[dependencies]
serde_json = "1"
# IMPORTANT: must match the host's mlua version EXACTLY. ExtraData layout
# inside the shared lua_State changes between mlua minor versions, so a
# mismatch is undefined behaviour. Pin with `=` so cargo refuses to upgrade.
mlua = { version = "=0.11.6", features = ["luau", "luau-jit"] }
