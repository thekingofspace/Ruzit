name: Build Ruzit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            ruzit_bin: ruzit.exe
            ruzitrun_bin: ruzitrun.exe
            exe_ext: .exe
          - os: ubuntu-latest
            platform: linux
            ruzit_bin: ruzit
            ruzitrun_bin: ruzitrun
            exe_ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake \
            libasound2-dev libudev-dev \
            libfontconfig1-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Ruzit

      - name: Build (release)
        working-directory: Ruzit
        run: cargo build --release

      - name: Set executable bit (unix)
        if: matrix.os != 'windows-latest'
        working-directory: Ruzit
        run: |
          chmod +x target/release/${{ matrix.ruzit_bin }}
          chmod +x target/release/${{ matrix.ruzitrun_bin }}

      - name: Stage raw binaries (plain names, no platform suffix)
        shell: bash
        working-directory: Ruzit
        run: |
          mkdir -p staging
          cp target/release/${{ matrix.ruzit_bin }}    staging/ruzit${{ matrix.exe_ext }}
          cp target/release/${{ matrix.ruzitrun_bin }} staging/ruzitrun${{ matrix.exe_ext }}
          ls -lh staging/

      - uses: actions/upload-artifact@v4
        with:
          name: ruzit-raw-${{ matrix.platform }}
          path: Ruzit/staging/*
          if-no-files-found: error

  combine:
    name: combine-and-zip
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download windows raw binaries
        uses: actions/download-artifact@v4
        with:
          name: ruzit-raw-windows
          path: stage/windows

      - name: Download linux raw binaries
        uses: actions/download-artifact@v4
        with:
          name: ruzit-raw-linux
          path: stage/linux

      - name: Restore +x on linux binaries
        run: |
          chmod +x stage/linux/ruzit
          chmod +x stage/linux/ruzitrun

      - name: Zip per platform (plain inner names → ruzit, ruzitrun)
        run: |
          mkdir -p release
          (cd stage/windows && zip -j ../../release/ruzit-windows.zip ruzit.exe ruzitrun.exe)
          (cd stage/linux   && zip -j ../../release/ruzit-linux.zip   ruzit ruzitrun)
          ls -lh release/
          for z in release/*.zip; do
            echo "--- $z ---"
            unzip -l "$z"
          done

      - name: Upload combined zips as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruzit-all
          path: release/*.zip
          if-no-files-found: error

  release:
    name: github-release
    needs: combine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release zips
        uses: actions/download-artifact@v4
        with:
          name: ruzit-all
          path: release

      - name: Determine version + tag
        id: meta
        run: |
          # Read version from runtime/Cargo.toml. The runtime crate is
          # the one whose semver users will care about; CLI tracks it.
          VERSION=$(grep -m1 '^version' Ruzit/runtime/Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          if [[ -z "$VERSION" ]]; then
            echo "Could not extract version from Ruzit/runtime/Cargo.toml" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Tag-driven release: trust whatever the tag says.
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="Ruzit ${TAG}"
          else
            # Push-driven release: tag derived from the Cargo.toml version.
            TAG="v${VERSION}"
            TITLE="Ruzit ${TAG}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"        >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}"    >> "$GITHUB_OUTPUT"
          echo "Building ${TITLE} (Cargo version ${VERSION})"

      - name: Move tag to current commit
        if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Force tag at HEAD so re-runs land cleanly even if the tag
          # already pointed somewhere else.
          git tag -f "${{ steps.meta.outputs.tag }}"
          git push -f origin "${{ steps.meta.outputs.tag }}"

      - name: Delete prior release at this tag (so we can recreate)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.meta.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "${{ steps.meta.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --yes
          fi

      - name: Create release with platform zips
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Auto-built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%dT%H:%M:%SZ).

          Assets — each archive contains the two binaries with their plain names so you can drop them on PATH and type \`ruzit\` directly:
          - \`ruzit-windows.zip\` → \`ruzit.exe\` + \`ruzitrun.exe\`
          - \`ruzit-linux.zip\`   → \`ruzit\` + \`ruzitrun\`

          Self-update target (default — \`/releases/latest/\` always points at the most recent stable release):
          \`\`\`
          ruzit self-update
          \`\`\`

          Or pin to this exact version:
          \`\`\`
          export RUZIT_RELEASE_BASE=https://github.com/$GITHUB_REPOSITORY/releases/download/${{ steps.meta.outputs.tag }}
          ruzit self-update
          \`\`\`"

          gh release create "${{ steps.meta.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.meta.outputs.title }}" \
            --notes "$NOTES" \
            --latest \
            release/ruzit-windows.zip \
            release/ruzit-linux.zip
