[package]
name = "Ruzit"
version = "0.1.0"
edition = "2024"

[dependencies]
mlua = { version = "0.10", features = ["luau"] }
serde_json = "1"
toml = "0.8"
serde_yaml = "0.9"
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
interprocess = "2"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
md-5 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
blake3 = "1"
hex = "0.4"
base64 = "0.22"
flate2 = "1"
zstd = "0.13"
winit = "0.30"
softbuffer = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_LibraryLoader",
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }
