[package]
name = "ruzit-core"
version = "4.4.0"
edition = "2024"

[lib]
name = "ruzit_core"
path = "src/lib.rs"

[dependencies]
serde_json = "1"
toml = "0.8"
serde_yaml = "0.9"
base64 = "0.22"
zstd = "0.13"
flate2 = "1"
aes-gcm = "0.10"
rand = "0.8"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
blake3 = "1"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_LibraryLoader",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
